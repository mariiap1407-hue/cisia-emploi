# Pile CISIA (depuis la racine du projet), sur le modèle du projet M5 :
#   docker compose up -d --build     construire et démarrer (MLflow, puis l'API)
#   docker compose ps                état : les deux services « healthy »
#   docker compose logs -f api       journaux de l'API
#   docker compose down              arrêter (journal et base MLflow conservés)
#
# - api    : http://localhost:8000/docs — le modèle est COPIÉ dans l'image : l'API ne dépend
#            pas du serveur MLflow pour prédire (elle reste disponible s'il tombe).
# - mlflow : http://localhost:5000 — serveur de suivi et registre des modèles de la pile.
#            Base et artefacts dans ./mlflow-data (ignoré par Git). Il démarre vide ; pour y
#            enregistrer un entraînement : MLFLOW_TRACKING_URI=http://localhost:5000
# La clé d'API est lue dans .env (jamais versionné, jamais copié dans l'image).
# L'interface Streamlit sera ajoutée ici au bloc 9.

services:
  api:
    build: .
    image: cisia-api:local
    container_name: cisia-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Journal, historique et feedbacks : hors de l'image, conservés entre deux redémarrages
      - journal:/app/outputs
    depends_on:
      mlflow:
        condition: service_healthy   # comme en M5 : la pile démarre dans l'ordre
    restart: unless-stopped
    # Contrôle de santé : défini dans le Dockerfile (/health = modèle chargé ET clé configurée)

  mlflow:
    image: python:3.12-slim
    container_name: cisia-mlflow
    ports:
      - "5000:5000"
    command:
      - sh
      - -c
      - >-
        pip install --no-cache-dir mlflow==3.16.1
        && mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri sqlite:////mlflow-data/mlflow.db
        --artifacts-destination /mlflow-data/artifacts
    volumes:
      - ./mlflow-data:/mlflow-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s   # MLflow est installé au démarrage du conteneur (comme en M5)
    restart: unless-stopped

volumes:
  journal:
