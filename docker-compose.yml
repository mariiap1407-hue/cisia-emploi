# Pile CISIA (depuis la racine du projet), sur le modèle du projet M5 :
#   docker compose up -d --build --wait     construire, démarrer et attendre que tout soit « healthy »
#   docker compose ps                       état des services
#   docker compose logs -f api              journaux de l'API
#   docker compose down                     arrêter (journal et base MLflow conservés)
#
# - api    : http://127.0.0.1:8000/docs — le modèle est COPIÉ dans l'image : l'API ne dépend pas
#            du serveur MLflow, ni pour démarrer ni pour prédire (un conseiller garde ses
#            prédictions même si MLflow est en panne). Pas de « depends_on » pour cette raison.
# - mlflow : http://127.0.0.1:5000 — serveur de suivi et registre des modèles de la pile.
#            Base et artefacts dans ./mlflow-data (ignoré par Git). Pour y enregistrer un
#            entraînement : MLFLOW_TRACKING_URI=http://localhost:5000
# Ports ouverts sur ce poste seulement (127.0.0.1) : MLflow n'a pas d'authentification.
# La clé d'API est lue dans .env (jamais versionné, jamais copié dans l'image).
# L'interface Streamlit sera ajoutée ici au bloc 9.

services:
  api:
    build: .
    image: cisia-api:local
    container_name: cisia-api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      # Journal, historique et feedbacks : hors de l'image, conservés entre deux redémarrages
      - journal:/app/outputs
    restart: unless-stopped
    # Contrôle de santé : défini dans le Dockerfile (/health = modèle chargé ET clé configurée)

  mlflow:
    build: ./docker/mlflow
    image: cisia-mlflow:local
    container_name: cisia-mlflow
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./mlflow-data:/mlflow-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  journal:
