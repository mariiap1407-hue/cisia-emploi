# CI/CD du projet CISIA, sur le modèle du projet M5 (2 jobs : test, puis construction de l'image).
#
# Différences avec M5, justifiées :
# - les vraies données (personnelles) ne vont jamais sur GitHub : la CI entraîne un modèle de
#   CONTRÔLE sur des données factices ; elle valide le code et la chaîne, pas la performance réelle ;
# - le candidat entraîné est testé sur SON jeu de référence (quality gate) AVANT tout le reste ;
# - retour du formateur sur M5 : l'image est testée AVANT d'être publiée, avec une boucle d'attente
#   sur /health (et non un « sleep » fixe) ;
# - l'image publiée est étiquetée « controle » : le modèle de production réel est construit sur le
#   poste (ou, dans une vraie agence, sur un serveur placé à côté des données).
#
# Démonstration du quality gate : lancer le workflow à la main (Actions > CI/CD > Run workflow) avec
# reference = data/factice/reference_derivee.csv → le gate échoue et l'image n'est pas construite.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reference:
        description: "Jeu de référence du quality gate (reference_derivee.csv pour la démonstration d'échec)"
        default: data/factice/reference.csv

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db   # runner éphémère : pas de serveur de suivi
      USE_REGISTRY: "false"
      REFERENCE: ${{ github.event.inputs.reference || 'data/factice/reference.csv' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Installer les dépendances et le module cisia
        run: |
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Qualité du code (ruff)
        run: ruff check .

      - name: Générer les données factices
        run: python scripts/generer_donnees_factices.py

      - name: Entraîner le candidat de contrôle (sans mise en production)
        run: |
          python scripts/entrainer.py --donnees data/factice/entrainement.csv --sans-recherche
          echo "CANDIDAT=$(ls -d models/candidats/*/ | head -n 1)" >> "$GITHUB_ENV"

      - name: Quality gate du candidat sur son jeu de référence
        run: |
          echo "Candidat : $CANDIDAT ; référence : $REFERENCE"
          CISIA_MODELE="$CANDIDAT" CISIA_REFERENCE="$REFERENCE" \
            pytest -v -s tests/test_qualite_modele.py::test_quality_gate_sur_le_jeu_de_reference

      - name: Tests unitaires et d'intégration
        run: pytest -q

      - name: Préparer le modèle de contrôle pour l'image
        run: python scripts/preparer_image_ci.py "$CANDIDAT" --sortie models/ci

      - name: Faire remonter le modèle de contrôle
        uses: actions/upload-artifact@v7
        with:
          name: modele-controle
          path: models/ci/

  build-test-push:
    needs: test   # ne démarre que si le job test (dont le quality gate) a réussi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/cisia-api
    steps:
      - uses: actions/checkout@v6

      - name: Récupérer le modèle de contrôle
        uses: actions/download-artifact@v7
        with:
          name: modele-controle
          path: models/ci/

      - name: Construire l'image (sans la publier)
        run: |
          docker build --build-arg MODELE=models/ci \
            --label "org.opencontainers.image.description=API CISIA - modele de CONTROLE (donnees factices)" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t cisia-api:ci .

      - name: Construire l'image MLflow de la pile
        run: docker build -t cisia-mlflow:ci docker/mlflow

      - name: Tester l'image AVANT publication (attente active sur /health)
        run: |
          CLE=$(python3 -c "import secrets; print(secrets.token_hex(16))")
          docker run -d --name api-test -p 8000:8000 -e CISIA_CLE_API="$CLE" cisia-api:ci

          # Attente active : jusqu'à 30 essais espacés de 2 s, au lieu d'un délai fixe
          for essai in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/health; then echo; echo "Prête après $essai essai(s)"; PRETE=1; break; fi
            sleep 2
          done
          if [ -z "$PRETE" ]; then docker logs api-test; exit 1; fi

          # Prédiction avec la clé : 200
          curl -fs -X POST http://127.0.0.1:8000/predict \
            -H "X-API-Key: $CLE" -H "Content-Type: application/json" \
            -d '{"usager": {"age": 35, "niveau_diplome": "Bac", "anciennete_poste_ans": 4.5, "code_rome_vise": "M1607", "synthese_entretien": "Projet clair, mobilite possible."}}'
          echo

          # Sans clé : 401 ; réentraînement dans l'image (sans données) : 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/predict -H 'Content-Type: application/json' -d '{}')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/retrain -H "X-API-Key: $CLE")" = 503
          echo "Image testée : santé 200, prédiction 200, sans clé 401, réentraînement 503"
          docker rm -f api-test

      - name: Authentification sur ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image testée (étiquettes « controle »)
        if: github.event_name != 'pull_request'
        run: |
          docker tag cisia-api:ci "$IMAGE:controle-${GITHUB_SHA::7}"
          docker tag cisia-api:ci "$IMAGE:controle"
          docker push "$IMAGE:controle-${GITHUB_SHA::7}"
          docker push "$IMAGE:controle"
