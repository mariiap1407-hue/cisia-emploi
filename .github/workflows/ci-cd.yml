# CI/CD du projet CISIA, sur le modèle du projet M5 (test, puis image), complété par le déploiement.
#
# Différences avec M5, justifiées :
# - les vraies données (personnelles) ne vont jamais sur GitHub : la CI entraîne un modèle de
#   CONTRÔLE sur des données factices ; elle valide le code et la chaîne, pas la performance réelle ;
# - le candidat entraîné est testé sur SON jeu de référence (quality gate) AVANT tout le reste ;
# - retour du formateur sur M5 : l'image est testée AVANT d'être publiée, avec une attente active
#   sur /health (et non un « sleep » fixe) ;
# - déploiement automatique sur un environnement de DÉMONSTRATION (Render, région Francfort) :
#   l'image publiée (désignée par son empreinte) y est déployée puis vérifiée. Le modèle y est
#   factice ; l'application réelle se déploierait sur un serveur de l'agence, à côté des données.
#
# Démonstration du quality gate : Actions > CI/CD > Run workflow, avec
# reference = data/factice/reference_derivee.csv → le gate échoue ; rien n'est construit ni déployé.
#
# Secrets et variables à définir dans GitHub (Settings > Secrets and variables > Actions) :
# - secret RENDER_DEPLOY_HOOK : adresse de déclenchement du déploiement (fournie par Render) ;
# - secret CISIA_CLE_API_DEMO : clé d'API du service de démonstration (la même que sur Render) ;
# - variable RENDER_URL : adresse publique du service (ex. https://cisia-api.onrender.com).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reference:
        description: "Jeu de référence du quality gate (reference_derivee.csv pour la démonstration d'échec)"
        default: data/factice/reference.csv

# Un seul run à la fois par branche. Hors de main, un nouveau push annule le run précédent (CI
# dépassée). Sur main, le run en cours va jusqu'au bout (déploiement ET vérification) et le suivant
# attend : un déploiement n'est jamais interrompu, et un ancien commit ne passe jamais après un récent.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db   # runner éphémère : pas de serveur de suivi
      USE_REGISTRY: "false"
      REFERENCE: ${{ github.event.inputs.reference || 'data/factice/reference.csv' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
            requirements-ui.txt

      - name: Installer les dépendances et le module cisia
        run: |
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Qualité du code (ruff)
        run: ruff check .

      - name: Générer les données factices
        run: python scripts/generer_donnees_factices.py

      - name: Entraîner le candidat de contrôle (sans mise en production)
        run: |
          python scripts/entrainer.py --donnees data/factice/entrainement.csv --sans-recherche
          echo "CANDIDAT=$(ls -d models/candidats/*/ | head -n 1)" >> "$GITHUB_ENV"

      - name: Quality gate du candidat sur son jeu de référence
        run: |
          echo "Candidat : $CANDIDAT ; référence : $REFERENCE"
          CISIA_MODELE="$CANDIDAT" CISIA_REFERENCE="$REFERENCE" CISIA_RAPPORT_GATE=rapport/quality_gate.json \
            pytest -v -s tests/test_qualite_modele.py::test_quality_gate_sur_le_jeu_de_reference

      - name: Tests unitaires et d'intégration
        run: pytest -q

      - name: Préparer le modèle de contrôle pour l'image
        run: |
          python scripts/preparer_image_ci.py "$CANDIDAT" --sortie models/ci
          cp "$CANDIDAT/infos_entrainement.json" rapport/infos_entrainement.json

      - name: Faire remonter le modèle de contrôle
        uses: actions/upload-artifact@v7
        with:
          name: modele-controle
          path: models/ci/

      - name: Faire remonter le rapport du quality gate (traçabilité, même en cas d'échec du gate)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rapport-quality-gate
          path: rapport/
          if-no-files-found: warn

  build-test-push:
    needs: test   # ne démarre que si le job test (dont le quality gate) a réussi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/cisia-api
    outputs:
      image: ${{ steps.publication.outputs.image }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Récupérer le modèle de contrôle
        uses: actions/download-artifact@v7
        with:
          name: modele-controle
          path: models/ci/

      - name: Version du modèle embarqué
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('models/ci/actuelle.json'))['run_id'])")
          echo "Version embarquée : $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Construire l'image de l'API (sans la publier)
        run: |
          docker build --build-arg MODELE=models/ci \
            --label "org.opencontainers.image.description=API CISIA - modele de CONTROLE (donnees factices)" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t cisia-api:ci .

      - name: Vérifier que les images MLflow et de l'interface se construisent
        run: |
          docker build -t cisia-mlflow:ci docker/mlflow
          docker build -f docker/ui/Dockerfile -t cisia-ui:ci .

      # Le parcours de l'interface est testé dans le job test (tests/test_interface.py) ; ici, on vérifie
      # que l'IMAGE de l'interface démarre réellement (dépendances, configuration, serveur Streamlit).
      - name: Vérifier que l'image de l'interface démarre
        run: |
          docker run -d --name ui-test -p 8501:8501 -e CISIA_API_URL=http://127.0.0.1:9 cisia-ui:ci
          for essai in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then echo " : interface prête (essai $essai)"; exit 0; fi
            sleep 2
          done
          echo "L'interface n'a pas démarré en 60 s"; exit 1

      - name: Journaux de l'interface en cas d'échec
        if: failure()
        run: docker logs ui-test || true

      - name: Arrêter le conteneur de l'interface
        if: always()
        run: docker rm -f ui-test || true

      - name: Tester l'image AVANT publication
        run: |
          # Clé jetable, propre à ce test, jamais affichée (pas de ::add-mask:: : la ligne de la commande
          # apparaissait en clair dans le journal du run)
          CLE=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          docker run -d --name api-test -p 8000:8000 -e CISIA_CLE_API="$CLE" cisia-api:ci
          python3 scripts/verifier_service.py http://127.0.0.1:8000 --cle "$CLE" \
            --version "${{ steps.version.outputs.version }}" --essais 30 --pause 2 --retrain 503

      - name: Journaux du conteneur en cas d'échec
        if: failure()
        run: docker logs api-test || true

      - name: Arrêter le conteneur de test
        if: always()
        run: docker rm -f api-test || true

      - name: Authentification sur ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image testée (étiquettes « controle »)
        id: publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker tag cisia-api:ci "$IMAGE:controle-${GITHUB_SHA::7}"
          docker tag cisia-api:ci "$IMAGE:controle"
          docker push "$IMAGE:controle-${GITHUB_SHA::7}"
          docker push "$IMAGE:controle"
          # Empreinte (digest) : désigne EXACTEMENT l'image testée, même si une étiquette est réutilisée
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:controle-${GITHUB_SHA::7}")
          echo "Image publiée : $IMAGE_DIGEST"
          echo "image=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  deploy-demo:
    needs: build-test-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: demo-render
      url: ${{ vars.RENDER_URL }}
    concurrency:
      group: deploy-demo   # un seul déploiement à la fois, jamais annulé en cours de route
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Vérifier la configuration du déploiement
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          CLE: ${{ secrets.CISIA_CLE_API_DEMO }}
          URL: ${{ vars.RENDER_URL }}
        run: |
          [ -n "$HOOK" ] || { echo "Secret RENDER_DEPLOY_HOOK absent"; exit 1; }
          [ -n "$CLE" ] || { echo "Secret CISIA_CLE_API_DEMO absent"; exit 1; }
          [ -n "$URL" ] || { echo "Variable RENDER_URL absente"; exit 1; }

      - name: Déployer l'image testée sur l'environnement de démonstration
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE_REF: ${{ needs.build-test-push.outputs.image }}
        run: |
          echo "Déploiement de $IMAGE_REF"
          IMAGE_URL=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_REF'], safe=''))")
          curl -fsS --max-time 30 -X POST "$HOOK&imgURL=$IMAGE_URL" > /dev/null
          echo "Déploiement demandé à Render"

      - name: Vérifier le service déployé (bonne version, prédiction, sécurité)
        env:
          CLE: ${{ secrets.CISIA_CLE_API_DEMO }}
          URL: ${{ vars.RENDER_URL }}
        run: |
          # Render télécharge l'image puis démarre le service : 15 minutes d'attente au maximum
          python3 scripts/verifier_service.py "$URL" --cle "$CLE" \
            --version "${{ needs.build-test-push.outputs.version }}" --essais 90 --pause 10 --duree-max 900 \
            --retrain 503
